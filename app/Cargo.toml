[package]
name = "mdm"
version = "0.4.1"
edition = "2021"

[dependencies]
anyhow = "1"
# gia' nell'albero via eframe: leggere gli appunti non aggiunge peso
arboard = { version = "3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
eframe = "0.29"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "fs", "time", "sync"] }

[dev-dependencies]
# test-util: orologio virtuale per testare il limitatore di banda senza dormire
tokio = { version = "1", features = ["test-util"] }

[build-dependencies]
ico = "0.4"
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
notify-rust = "4"
tray-icon = "0.19"
winreg = "0.52"
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
strip = true
